<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>候选人物模型 · BAMEN</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#101720;color:#e8eef5;font:14px system-ui,sans-serif}
    header{padding:22px 28px;border-bottom:1px solid #ffffff20}h1{margin:0 0 6px;font-size:22px}
    p{margin:4px 0;color:#aab7c4}main{height:calc(100vh - 122px);min-height:420px}canvas{display:block;width:100%;height:100%}
    footer{padding:9px 28px;border-top:1px solid #ffffff18;color:#aebccb;font:12px ui-monospace,monospace}
  </style>
  <script type="importmap">{"imports":{"three":"../vendor/three/build/three.module.js","three/addons/":"../vendor/three/examples/jsm/"}}</script>
</head>
<body>
  <header><h1>BAMEN · Modern Military Soldier</h1><p>GitHub 候选模型 · CC BY 4.0 · 仅用于本地评估</p></header>
  <main id="stage"></main><footer id="status">正在加载候选模型…</footer>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    const host=document.querySelector('#stage'), status=document.querySelector('#status');
    const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
    renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.1; host.append(renderer.domElement);
    const scene=new THREE.Scene(); scene.background=new THREE.Color(0x1b2631);
    scene.add(new THREE.HemisphereLight(0xdbe9ff,0x3e463f,2.2));
    const key=new THREE.DirectionalLight(0xffe1ba,3.5); key.position.set(-3,6,5); scene.add(key);
    const rim=new THREE.DirectionalLight(0x9fc8ff,2.3); rim.position.set(3,3,-4); scene.add(rim);
    const floor=new THREE.Mesh(new THREE.PlaneGeometry(20,20),new THREE.MeshStandardMaterial({color:0x303a44,roughness:1})); floor.rotation.x=-Math.PI/2; floor.position.y=-.01; scene.add(floor);
    const camera=new THREE.PerspectiveCamera(28,1,.01,50); camera.position.set(2.75,1.35,4.9); camera.lookAt(0,1.0,0);
    const resize=()=>{const r=host.getBoundingClientRect();renderer.setSize(r.width,r.height);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}; addEventListener('resize',resize); resize();
    const gltf=await new GLTFLoader().loadAsync('../models/bamen_military_soldier.glb'); const model=gltf.scene;
    model.updateMatrixWorld(true);
    const bounds=new THREE.Box3().setFromObject(model,true), size=bounds.getSize(new THREE.Vector3()), center=bounds.getCenter(new THREE.Vector3());
    const scale=1.82/size.y;
    model.scale.multiplyScalar(scale);
    model.position.set(-center.x*scale,-bounds.min.y*scale,-center.z*scale);
    model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;if(o.material){o.material.roughness=Math.max(.55,o.material.roughness??.8);}}}); scene.add(model);
    status.textContent=`已加载 · 原始尺寸 ${size.x.toFixed(2)} × ${size.y.toFixed(2)} × ${size.z.toFixed(2)} · ${gltf.animations.length} 个动画`;
    renderer.setAnimationLoop(()=>renderer.render(scene,camera));
  </script>
</body>
</html>
